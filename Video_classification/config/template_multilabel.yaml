seed: 42
task_type: multilabel
manifest_path: manifests/multilabel_manifest.csv

# For multilabel, use `labels` column with pipe separator.
# Example labels value: violent|robbery
class_names:
  - normal
  - violent
  - robbery
  - fight
  - murder

splits:
  train: train
  val: val
  test: test

data:
  num_frames: 16
  image_size: 112
  clip_duration_sec: 2.0
  random_clip_for_train: true

model:
  name: r3d_18
  pretrained: true
  dropout: 0.2
  freeze_backbone: false

training:
  epochs: 20
  batch_size: 4
  num_workers: 4
  pin_memory: true
  amp: true
  grad_clip_norm: 1.0
  log_every: 20
  multilabel_threshold: 0.5

optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.01

scheduler:
  name: cosine
  t_max: 20
  eta_min: 0.000001

checkpoint:
  output_dir: runs/multilabel_r3d18
  resume_from: null
